application:
  name: dokploy
  pods:
  - name: app
    image: dokploy/dokploy:latest
    path: /
    servicePorts:
    - 3000
    resources:
      limits:
        cpu: "2"
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi
    vars:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://dokploy:${POSTGRES_PASSWORD}@dokploy-postgres.pod:5432/dokploy
  - name: dokploy-postgres
    image: postgres:16-alpine
    servicePorts:
    - 5432
    vars:
      POSTGRES_USER: dokploy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dokploy
    volumes:
    - name: dokploy-pgdata
      mountPath: /var/lib/postgresql/data
      size: 5Gi
